name: Демо графа широкий запуск

# Проверка раскладки на объёмном DAG: 10 колонок по горизонтали,
# до пяти задач в колонке по вертикали и ветки через несколько колонок
# (security-scan → notify, a11y → deploy-prod, audit → deploy-preview,
# format → release-notes).

on:
  workflow_dispatch:
    inputs:
      fail_job:
        description: "Уронить задачу a11y (красный статус, rerun и skipped)"
        type: boolean
        default: false
      slow_seconds:
        description: "Длительность задачи perf, сек (проверка running/waiting)"
        type: string
        default: "15"

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Подготовка
        run: |
          echo "Инициализация окружения"
          sleep 2

  lint:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Линтинг
        run: |
          echo "Линтинг кода"
          sleep 3

  types:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Проверка типов
        run: |
          echo "Проверка типов"
          sleep 3

  audit:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Аудит зависимостей
        run: |
          echo "Аудит зависимостей"
          sleep 2

  format:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Проверка форматирования
        run: |
          echo "Проверка форматирования"
          sleep 2

  security-scan:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Сканирование безопасности
        run: |
          echo "Сканирование безопасности"
          sleep 4

  unit-core:
    needs: [lint, types]
    runs-on: ubuntu-latest
    steps:
      - name: Тесты ядра
        run: |
          echo "unit-core"
          sleep 4

  unit-ui:
    needs: [lint, types]
    runs-on: ubuntu-latest
    steps:
      - name: Тесты интерфейса
        run: |
          echo "unit-ui"
          sleep 4

  unit-api:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Тесты API
        run: |
          echo "unit-api"
          sleep 3

  unit-cli:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Тесты CLI
        run: |
          echo "unit-cli"
          sleep 3

  unit-store:
    needs: types
    runs-on: ubuntu-latest
    steps:
      - name: Тесты стейта
        run: |
          echo "unit-store"
          sleep 3

  build-app:
    needs: [unit-core, unit-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Сборка приложения
        run: |
          echo "build-app"
          sleep 5

  build-docs:
    needs: unit-cli
    runs-on: ubuntu-latest
    steps:
      - name: Сборка документации
        run: |
          echo "build-docs"
          sleep 3

  build-storybook:
    needs: [unit-ui, unit-store]
    runs-on: ubuntu-latest
    steps:
      - name: Сборка сторибука
        run: |
          echo "build-storybook"
          sleep 3

  e2e-chrome:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - name: E2E в Chrome
        run: |
          echo "e2e-chrome"
          sleep 5

  e2e-firefox:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - name: E2E в Firefox
        run: |
          echo "e2e-firefox"
          sleep 5

  e2e-safari:
    needs: build-storybook
    runs-on: ubuntu-latest
    steps:
      - name: E2E в Safari
        run: |
          echo "e2e-safari"
          sleep 4

  contract:
    needs: build-docs
    runs-on: ubuntu-latest
    steps:
      - name: Контрактные тесты
        run: |
          echo "contract"
          sleep 3

  db-migrate:
    needs: build-docs
    runs-on: ubuntu-latest
    steps:
      - name: Проверка миграций
        run: |
          echo "db-migrate"
          sleep 3

  smoke:
    needs: [e2e-chrome, e2e-firefox]
    runs-on: ubuntu-latest
    steps:
      - name: Дымовые тесты
        run: |
          echo "smoke"
          sleep 3

  perf:
    needs: [e2e-firefox, contract]
    runs-on: ubuntu-latest
    steps:
      - name: Нагрузочные тесты
        env:
          SLOW_SECONDS: ${{ inputs.slow_seconds }}
        run: |
          echo "Ждём ${SLOW_SECONDS}с: задача в running, зависимые — в waiting"
          sleep "${SLOW_SECONDS}"

  release-notes:
    needs: [smoke, format]
    runs-on: ubuntu-latest
    steps:
      - name: Заметки о релизе
        run: |
          echo "release-notes"
          sleep 2

  changelog:
    needs: perf
    runs-on: ubuntu-latest
    steps:
      - name: Обновление changelog
        run: |
          echo "changelog"
          sleep 2

  artifacts:
    needs: [smoke, perf]
    runs-on: ubuntu-latest
    steps:
      - name: Публикация артефактов
        run: |
          echo "artifacts"
          sleep 3

  deploy-staging:
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на стейдж
        run: |
          echo "deploy-staging"
          sleep 3

  deploy-preview:
    needs: [artifacts, db-migrate, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Деплой превью
        run: |
          echo "deploy-preview"
          sleep 3

  deploy-prod:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Деплой в прод
        run: |
          echo "deploy-prod"
          sleep 3

  notify:
    needs: [deploy-prod, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Уведомление
        run: echo "Готово"



